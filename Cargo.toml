[package]
name = "chibchacum"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Juan Carlos Isaza"]
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# Cliente HTTP — rustls, NUNCA openssl (binario portable). Igual que mindalá.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "query"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros"] }
# BD: SQLite, la memoria (dedup, no re-contactar). Keyless también en compilación.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "sqlite", "macros", "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

# --- Estándar de nacimiento (D26): dependencias optimizadas en debug ---
[profile.dev.package."*"]
opt-level = 3

# PUERTA de buenas prácticas (D26): solo lo que `clippy --fix` limpia a cero.
[lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"
